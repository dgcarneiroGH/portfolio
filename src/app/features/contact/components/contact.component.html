<section class="contact">
  <div class="contact-container">
    <!-- Blobs de luz decorativos -->
    <div class="glow glow--mint" aria-hidden="true"></div>
    <div class="glow glow--azure" aria-hidden="true"></div>
    <div class="glow glow--amber" aria-hidden="true"></div>

    <header class="contact-intro">
      <h1 class="intro-title">
        <span class="intro-lead">{{ "CONTACT.NOW_WE_KNOW" | translate }}</span>
        <span class="intro-cta">{{ "CONTACT.TALK" | translate }}</span>
      </h1>
      <p class="intro-description">{{ "CONTACT.DESCRIPTION" | translate }}</p>
    </header>

    <div class="form-slot">
      <app-contact-form></app-contact-form>
    </div>
  </div>
</section>
