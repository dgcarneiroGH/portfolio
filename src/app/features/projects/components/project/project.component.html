<div
  class="project-container"
  [class.expanded]="showMoreInfo()"
  [class.collapsed]="!showMoreInfo()"
  [style.--dynamic-gradient]="dynamicGradient()"
  [style.--animation-delay]="animationDelay()"
>
  <div class="project-border">
    <button
      class="cover-img"
      [class.has-url]="url()"
      (click)="goTo()"
      (keydown)="onKeyDown($event, 'goTo')"
      [attr.aria-label]="
        ('PROJECTS.VIEW_PROJECT' | translate: { name: name() }) + ' — ' + (altKey() | translate)
      "
      type="button"
    >
      <img
        class="cover-img-el"
        [src]="coverImgSrc() + '.avif'"
        [alt]="altKey() | translate"
      />
    </button>

    <div class="project-info">
      <h3 class="title" [class.show]="showMoreInfo()" [id]="'project-title-' + index()">{{ name() }}</h3>

      <div class="project-details">
        <p
          class="description"
          [class.show]="showMoreInfo()"
          [id]="'project-desc-' + index()"
          [attr.aria-labelledby]="'project-title-' + index()"
          [innerHTML]="description() | translate"
        ></p>

        <app-button
          style="z-index: 0"
          [color]="btnColor()"
          [text]="(showMoreInfo() ? '-' : '+') + ' Info'"
          [disabled]="!canToggleInfo()"
          (buttonClick)="handleMoreInfoClick()"
          [attr.aria-expanded]="showMoreInfo()"
          [attr.aria-controls]="'project-desc-' + index()"
          [attr.aria-label]="
            (showMoreInfo() ? 'PROJECTS.TOGGLE_INFO_HIDE' : 'PROJECTS.TOGGLE_INFO_SHOW') | translate
          "
        ></app-button>
      </div>
    </div>
  </div>
</div>
