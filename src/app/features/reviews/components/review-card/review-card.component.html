<article class="review-card" [class]="'variant-' + variant()">
  <header class="card-header">
    <h3 class="name">{{ review().fullName }}</h3>
    @if (review().role) {
      <p class="role">{{ review().role }}</p>
    }
  </header>

  <p
    class="rating"
    role="img"
    [attr.aria-label]="'REVIEWS.RATING_ARIA' | translate: { count: review().rating }"
  >
    @for (star of stars; track star) {
      <svg
        class="star"
        [class.lit]="isLit(star)"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <polygon
          points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
        />
      </svg>
    }
  </p>

  <blockquote class="message">{{ review().message }}</blockquote>

  @if (review().tag || review().category) {
    <footer class="card-footer">
      @if (review().tag) {
        <span class="tag-chip">{{ review().tag }}</span>
      }
      @if (review().category) {
        <span class="category">{{ review().category }}</span>
      }
    </footer>
  }
</article>
