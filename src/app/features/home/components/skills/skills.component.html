<div
  class="skills"
  role="group"
  [attr.aria-label]="'HOME.SKILLS_LABEL' | translate"
>
  <span class="skills-label" aria-hidden="true">
    <svg
      class="skills-label-icon"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M8.7 15.3 4.4 11l4.3-4.3-1.4-1.4L1.6 11l5.7 5.7 1.4-1.4zm6.6 0 4.3-4.3-4.3-4.3 1.4-1.4L22.4 11l-5.7 5.7-1.4-1.4z"
        fill="currentColor"
      />
    </svg>
    {{ 'HOME.SKILLS_LABEL' | translate }}
  </span>
  <ul class="skills-list">
    @for (skill of skills; track skill.labelKey) {
      <li>
        <span class="skill-pill">
          <img
            class="skill-pill-icon"
            [src]="skill.iconSrc"
            alt=""
            aria-hidden="true"
            width="14"
            height="14"
            loading="lazy"
            decoding="async"
          />
          <span [innerHTML]="skill.labelKey | translate"></span>
        </span>
      </li>
    }
  </ul>
</div>
