<section class="home">
  <div class="home-content">
    <div class="intro">
      <h1 class="home-title">
        {{ "HOME.TITLE" | translate }}
        <span class="home-title-highlight">{{ "HOME.TITLE_HIGHLIGHT" | translate }}</span>
      </h1>
      <p class="home-subtitle">{{ "HOME.SUBTITLE" | translate }}</p>
      <p
        class="home-description"
        [innerHTML]="'HOME.PARAGRAPH' | translate"
      ></p>

      <app-skills class="home-skills" />

      <div class="home-cta">
        <a class="cta cta--primary" href="#contacto">
          <svg
            class="cta-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"
              fill="currentColor"
            />
          </svg>
          <span>{{ "HOME.CTA_CONTACT" | translate }}</span>
        </a>
      </div>
    </div>

    <div class="showcase">
      <app-code-window />

      <img
        class="character"
        src="assets/images/nomacoda/nomacoda_full_transparent-768.avif"
        srcset="
          assets/images/nomacoda/nomacoda_full_transparent-512.avif 512w,
          assets/images/nomacoda/nomacoda_full_transparent-768.avif 768w
        "
        sizes="(max-width: 768px) 60vw, 320px"
        width="768"
        height="768"
        decoding="async"
        [attr.alt]="'HOME.CHARACTER_ALT' | translate"
      />
    </div>
  </div>

  <img
    class="home-mountains"
    src="assets/images/mountains-1440.avif"
    srcset="
      assets/images/mountains-768.avif   768w,
      assets/images/mountains-1440.avif 1440w
    "
    sizes="100vw"
    width="1440"
    height="960"
    alt=""
    fetchpriority="high"
    decoding="async"
  />
</section>
