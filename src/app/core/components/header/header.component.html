<header class="header">
  <a class="brand" routerLink="/" [attr.aria-label]="'COMMON.NAV_HOME' | translate">
    <div class="brand-logo" aria-hidden="true">
      <span class="brand-logo-inner">NC</span>
    </div>
    <div class="brand-text">
      <span class="brand-name">NOMACODA</span>
      <span class="brand-subtitle">{{ 'HEADER.BRAND_SUBTITLE' | translate }}</span>
    </div>
  </a>

  <nav
    class="header-nav"
    [attr.aria-label]="'HEADER.NAV_ARIA' | translate"
  >
    <ul>
      <li>
        <a routerLink="/about-me" routerLinkActive="is-active">
          <span class="nav-index" aria-hidden="true">01.</span>
          <span class="nav-label">{{ 'HEADER.NAV_ABOUT' | translate }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/success-cases" routerLinkActive="is-active">
          <span class="nav-index" aria-hidden="true">02.</span>
          <span class="nav-label">{{ 'HEADER.NAV_CASES' | translate }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/reviews" routerLinkActive="is-active">
          <span class="nav-index" aria-hidden="true">03.</span>
          <span class="nav-label">{{ 'HEADER.NAV_REVIEWS' | translate }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/contact" routerLinkActive="is-active">
          <span class="nav-index" aria-hidden="true">04.</span>
          <span class="nav-label">{{ 'HEADER.NAV_CONTACT' | translate }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="header-actions">
    <a
      class="status-pill"
      [class.status-pill--unavailable]="!isAvailable()"
      routerLink="/contact"
      [attr.aria-label]="(statusKey() | translate) + ' — ' + ('HEADER.STATUS_LINK_ARIA' | translate)"
    >
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">{{ statusKey() | translate }}</span>
    </a>
    <div class="header-lang">
      <app-lang-selector />
    </div>
  </div>
</header>
