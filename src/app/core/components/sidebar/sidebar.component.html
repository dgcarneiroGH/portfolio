<nav class="dock" [class.dock--closed]="!open()" [attr.aria-label]="'COMMON.SOCIAL_NAV' | translate">
  <button
    class="dock__toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-controls="dock-panel"
    [attr.aria-label]="(open() ? 'COMMON.DOCK_CLOSE' : 'COMMON.DOCK_OPEN') | translate"
  >
    <span class="dock__glyph" aria-hidden="true">
      <span class="dock__pill"></span>
      <span class="dock__plus"></span>
    </span>
  </button>

              class="dock__item dock__item--{{ link.icon }}"
              [href]="link.profileUrl | translate"
              [attr.aria-label]="link.title"
              target="_blank"
              rel="noopener noreferrer"
